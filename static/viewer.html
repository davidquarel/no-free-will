<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>live conversations · no free will</title>
  <style>
    :root {
      --bg: #0e1116; --panel: #161b22; --fg: #e6edf3; --muted: #8b949e;
      --mono: "SF Mono", "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    header { max-width: 1200px; margin: 0 auto; padding: 28px 24px 8px; }
    h1 { margin: 0 0 4px; font-size: 24px; letter-spacing: -0.02em; }
    .sub { color: var(--muted); font-size: 14px; }
    .dot { color: #f85149; }
    main {
      max-width: 1200px; margin: 0 auto; padding: 16px 24px 48px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px;
    }
    .conv { background: var(--panel); border: 1px solid #30363d; border-radius: 10px; overflow: hidden; }
    .conv-head {
      display: flex; justify-content: space-between; gap: 8px; align-items: center;
      padding: 8px 12px; border-bottom: 1px solid #30363d;
      font-family: var(--mono); font-size: 12px; color: var(--muted);
    }
    .hdr-right { display: flex; gap: 8px; align-items: center; }
    .score { font-weight: 600; font-variant-numeric: tabular-nums; }
    .flag { font-size: 16px; }
    .del { background: none; border: 0; color: #f85149; cursor: pointer;
      font-size: 14px; line-height: 1; padding: 0 2px; display: none; }
    .del.show { display: inline; }
    .ban { background: none; border: 1px solid rgba(227,179,65,0.4); color: #e3b341; cursor: pointer;
      font-size: 11px; line-height: 1; padding: 2px 6px; border-radius: 5px; display: none; }
    .ban.show { display: inline; }
    .admin { margin-top: 12px; display: flex; gap: 6px; align-items: center; font-size: 13px; }
    .admin input { background: #0d1117; color: var(--fg); border: 1px solid #30363d; border-radius: 6px; padding: 5px 8px; }
    .admin button { background: #21262d; color: var(--fg); border: 1px solid #30363d; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
    .admin button:hover { background: #30363d; }
    #astatus { color: var(--muted); font-family: var(--mono); font-size: 12px; }
    #astatus.ok { color: #56d364; }
    #astatus.err { color: #f85149; }
    .banlist { margin-top: 12px; }
    .banlist-head { color: var(--muted); font-family: var(--mono); font-size: 12px; margin-bottom: 4px; }
    .banlist ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; max-width: 460px; }
    .banlist li { display: flex; justify-content: space-between; align-items: center; gap: 8px;
      background: var(--panel); border: 1px solid #30363d; border-radius: 6px; padding: 4px 8px; }
    .banlist code { font-family: var(--mono); font-size: 12px; color: var(--fg); }
    .unban { background: #21262d; color: var(--fg); border: 1px solid #30363d; border-radius: 5px;
      padding: 3px 8px; cursor: pointer; font-size: 12px; }
    .unban:hover { background: #30363d; }
    .conv-body {
      margin: 0; padding: 12px; min-height: 90px; max-height: 320px; overflow-y: auto;
      font-family: var(--mono); font-size: 13px; line-height: 1.5;
      white-space: pre-wrap; word-break: break-word;
    }
    .empty { color: var(--muted); font-style: italic; }
    .none { color: var(--muted); padding: 40px 24px; grid-column: 1 / -1; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>live conversations <span class="dot">●</span></h1>
    <div class="sub">Everyone currently typing into the app, streamed live. <span id="count">0</span> active.</div>
    <div class="admin">
      <input type="password" id="pw" placeholder="admin password" autocomplete="off" />
      <button id="unlock" type="button">unlock</button>
      <span id="astatus">locked — unlock to delete / ban</span>
    </div>
    <div class="banlist" id="banlist" hidden>
      <div class="banlist-head">banned browsers (<span id="bancount">0</span>)</div>
      <ul id="bans"></ul>
    </div>
  </header>
  <main id="grid">
    <div class="none" id="disabled" hidden>The live conversation viewer has been turned off by an admin.</div>
    <div class="none" id="none">No one is connected right now.</div>
  </main>

  <script>
    const grid = document.getElementById("grid");
    const countEl = document.getElementById("count");
    const noneEl = document.getElementById("none");
    const disabledEl = document.getElementById("disabled");
    const pwEl = document.getElementById("pw");
    const unlockEl = document.getElementById("unlock");
    const aStatus = document.getElementById("astatus");
    const banlistEl = document.getElementById("banlist");
    const bansUl = document.getElementById("bans");
    const banCount = document.getElementById("bancount");
    const panels = {};
    let sock = null;
    let adminPw = null;     // verified admin password
    let unlocked = false;
    let viewerEnabled = true;  // admin can turn the whole live feed off

    function refresh() {
      const n = Object.keys(panels).length;
      countEl.textContent = n;
      disabledEl.hidden = viewerEnabled;
      // "no one connected" only when the feed is on and genuinely empty
      noneEl.style.display = viewerEnabled && !n ? "" : "none";
    }
    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    function panelFor(id, flag) {
      if (panels[id]) return panels[id];
      const el = document.createElement("section");
      el.className = "conv";
      el.innerHTML =
        `<div class="conv-head">` +
        `<span>${id} <span class="score" title="words fully predicted">—</span></span>` +
        `<span class="hdr-right"><span class="flag" title="approx. location">${flag || "🌐"}</span>` +
        `<button class="ban${unlocked ? " show" : ""}" title="ban this browser from reconnecting">ban</button>` +
        `<button class="del${unlocked ? " show" : ""}" title="delete this conversation">✕</button>` +
        `</span></div><pre class="conv-body"></pre>`;
      grid.appendChild(el);
      el.querySelector(".del").addEventListener("click", () => {
        if (sock && sock.readyState === 1) {
          sock.send(JSON.stringify({ action: "delete", id, password: adminPw }));
        }
      });
      el.querySelector(".ban").addEventListener("click", () => {
        if (sock && sock.readyState === 1 &&
            confirm(`Ban ${id}? Their browser won't be able to reconnect (clearing storage/incognito gets around it).`)) {
          sock.send(JSON.stringify({ action: "ban", id, password: adminPw }));
        }
      });
      panels[id] = {
        el, body: el.querySelector(".conv-body"),
        score: el.querySelector(".score"), flag: el.querySelector(".flag"),
      };
      refresh();
      return panels[id];
    }

    function setFlag(id, flag) {
      const p = panels[id];
      if (p && flag) p.flag.textContent = flag;
    }

    function setScore(id, score) {
      const p = panels[id];
      if (!p) return;
      if (score == null) {
        p.score.textContent = "—";
        p.score.style.color = "";
      } else {
        p.score.textContent = Math.round(score * 100) + "%";
        p.score.style.color = `hsl(${Math.round(120 * score)}, 70%, 62%)`; // red→green
      }
    }

    function renderBans(list) {
      banCount.textContent = list.length;
      bansUl.innerHTML = "";
      for (const cid of list) {
        const li = document.createElement("li");
        const code = document.createElement("code");
        code.textContent = cid.length > 16 ? cid.slice(0, 16) + "…" : cid;
        code.title = cid;
        const btn = document.createElement("button");
        btn.className = "unban";
        btn.textContent = "unban";
        btn.addEventListener("click", () => {
          if (sock && sock.readyState === 1) {
            sock.send(JSON.stringify({ action: "unban", cid, password: adminPw }));
          }
        });
        li.append(code, btn);
        bansUl.appendChild(li);
      }
    }

    unlockEl.addEventListener("click", () => {
      if (sock && sock.readyState === 1) sock.send(JSON.stringify({ admin_check: pwEl.value }));
    });
    pwEl.addEventListener("keydown", (e) => { if (e.key === "Enter") unlockEl.click(); });
    function setText(id, text) {
      const p = panels[id];
      if (!p) return;
      if (text) p.body.textContent = text;
      else p.body.innerHTML = '<span class="empty">(typing…)</span>';
      p.body.scrollTop = p.body.scrollHeight;
    }

    function connect() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      sock = new WebSocket(`${proto}://${location.host}/sessions`);
      sock.onmessage = (ev) => {
        const d = JSON.parse(ev.data);
        if (typeof d.admin_ok === "boolean") {
          unlocked = d.admin_ok;
          adminPw = unlocked ? pwEl.value : null;
          document.querySelectorAll(".del, .ban").forEach((b) => b.classList.toggle("show", unlocked));
          banlistEl.hidden = !unlocked;          // ban list only appears when unlocked
          if (unlocked) renderBans(d.bans || []);
          aStatus.textContent = unlocked ? "unlocked — ✕ delete · ban · manage bans below" : "wrong password";
          aStatus.className = unlocked ? "ok" : "err";
          return;
        }
        if (d.type === "bans") { renderBans(d.bans || []); return; }
        if (d.error) { aStatus.textContent = d.error; aStatus.className = "err"; return; }
        if (d.type === "viewer_state") {
          // Admin turned the live feed on/off. When off, drop all panels and show
          // the notice; when on, a fresh snapshot follows to repopulate.
          viewerEnabled = d.enabled;
          if (!viewerEnabled) {
            for (const id of Object.keys(panels)) { panels[id].el.remove(); delete panels[id]; }
          }
          refresh();
          return;
        }
        if (d.type === "snapshot") {
          for (const id of Object.keys(panels)) { panels[id].el.remove(); delete panels[id]; }
          for (const s of d.sessions) { panelFor(s.id, s.flag); setText(s.id, s.text); setScore(s.id, s.score); }
          refresh();
        } else if (d.type === "open") {
          panelFor(d.id, d.flag); setText(d.id, "");
        } else if (d.type === "update") {
          panelFor(d.id); setText(d.id, d.text);
        } else if (d.type === "score") {
          setScore(d.id, d.score);
        } else if (d.type === "flag") {
          setFlag(d.id, d.flag);
        } else if (d.type === "close") {
          const p = panels[d.id];
          if (p) { p.el.remove(); delete panels[d.id]; refresh(); }
        }
      };
      sock.onclose = () => setTimeout(connect, 1500);
    }
    connect();
  </script>
</body>
</html>
