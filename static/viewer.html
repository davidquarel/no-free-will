<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>live conversations · no free will</title>
  <style>
    :root {
      --bg: #0e1116; --panel: #161b22; --fg: #e6edf3; --muted: #8b949e;
      --mono: "SF Mono", "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    header { max-width: 1200px; margin: 0 auto; padding: 28px 24px 8px; }
    h1 { margin: 0 0 4px; font-size: 24px; letter-spacing: -0.02em; }
    .sub { color: var(--muted); font-size: 14px; }
    .dot { color: #f85149; }
    main {
      max-width: 1200px; margin: 0 auto; padding: 16px 24px 48px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px;
    }
    .conv { background: var(--panel); border: 1px solid #30363d; border-radius: 10px; overflow: hidden; }
    .conv-head {
      display: flex; justify-content: space-between; gap: 8px;
      padding: 8px 12px; border-bottom: 1px solid #30363d;
      font-family: var(--mono); font-size: 12px; color: var(--muted);
    }
    .conv-body {
      margin: 0; padding: 12px; min-height: 90px; max-height: 320px; overflow-y: auto;
      font-family: var(--mono); font-size: 13px; line-height: 1.5;
      white-space: pre-wrap; word-break: break-word;
    }
    .empty { color: var(--muted); font-style: italic; }
    .none { color: var(--muted); padding: 40px 24px; grid-column: 1 / -1; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>live conversations <span class="dot">●</span></h1>
    <div class="sub">Everyone currently typing into the app, streamed live. <span id="count">0</span> active.</div>
  </header>
  <main id="grid"><div class="none" id="none">No one is connected right now.</div></main>

  <script>
    const grid = document.getElementById("grid");
    const countEl = document.getElementById("count");
    const noneEl = document.getElementById("none");
    const panels = {};

    function refresh() {
      const n = Object.keys(panels).length;
      countEl.textContent = n;
      noneEl.style.display = n ? "none" : "";
    }
    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    function panelFor(id, ip) {
      if (panels[id]) return panels[id];
      const el = document.createElement("section");
      el.className = "conv";
      el.innerHTML =
        `<div class="conv-head"><span>${id}</span><span>${ip || ""}</span></div>` +
        `<pre class="conv-body"></pre>`;
      grid.appendChild(el);
      panels[id] = { el, body: el.querySelector(".conv-body") };
      refresh();
      return panels[id];
    }
    function setText(id, text) {
      const p = panels[id];
      if (!p) return;
      if (text) p.body.textContent = text;
      else p.body.innerHTML = '<span class="empty">(typing…)</span>';
      p.body.scrollTop = p.body.scrollHeight;
    }

    function connect() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      const ws = new WebSocket(`${proto}://${location.host}/sessions`);
      ws.onmessage = (ev) => {
        const d = JSON.parse(ev.data);
        if (d.type === "snapshot") {
          for (const id of Object.keys(panels)) { panels[id].el.remove(); delete panels[id]; }
          for (const s of d.sessions) { panelFor(s.id, s.ip); setText(s.id, s.text); }
          refresh();
        } else if (d.type === "open") {
          panelFor(d.id, d.ip); setText(d.id, "");
        } else if (d.type === "update") {
          panelFor(d.id); setText(d.id, d.text);
        } else if (d.type === "close") {
          const p = panels[d.id];
          if (p) { p.el.remove(); delete panels[d.id]; refresh(); }
        }
      };
      ws.onclose = () => setTimeout(connect, 1500);
    }
    connect();
  </script>
</body>
</html>
